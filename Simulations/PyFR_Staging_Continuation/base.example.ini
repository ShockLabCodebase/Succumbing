; Skeleton of the production PyFR config, showing only what the driver needs
; and the settings that matter for it. Fill in the physics (constants,
; viscosity, boundary names) for the real case. Units: D = 1, rho_inf = 1,
; c_inf = 1, so p_inf = 1/gamma and cp*T_inf = 1/(gamma - 1).

[backend]
precision = double

[constants]
gamma = 1.4
; mu, Pr (and cpTref, cpTs for Sutherland) set from the experimental Re
mu = 0.0
Pr = 0.72

[solver]
system = navier-stokes
order = 3
shock-capturing = entropy-filter
viscosity-correction = none

[solver-entropy-filter]
d-min = 1e-6
p-min = 1e-6
e-tol = 1e-6
niters = 2
formulation = nonlinear

[solver-time-integrator]
formulation = std
scheme = rk45
; Fixed dt: the sampler samples every nsteps, so dt must not adapt
controller = none
dt = 0.0
; tstart and tend are overwritten by the driver for each segment
tstart = 0.0
tend = 0.0

; The driver sets pt = NPR * p_ambient here. cpTt = 2.5 for a cold jet
; (T0 = T_inf). theta/phi set the inflow direction; check the angle
; convention in the PyFR docs against the jet axis of your mesh.
[soln-bcs-inlet]
type = sub-in-ftpttang
pt = 1.5714285714285714
cpTt = 2.5
theta = 0.0
phi = 90.0

[soln-bcs-wall]
type = no-slp-adia-wall

[soln-bcs-farfield]
type = char-riem-inv
rho = 1.0
u = 0.0
v = 0.0
w = 0.0
p = 0.7142857142857143

; Lip-line ring of 8 probes (m = 0 after averaging). The driver sets file,
; file-format and file-dataset; it keeps samp-pts and nsteps from here.
; nsteps * dt sets the sampling rate: keep it well above the tone frequency
; (at least ~10 samples per A1/A2 cycle).
[soln-plugin-sampler]
nsteps = 10
samp-pts = [(0.1, 0.55, 0.0), (0.1, 0.3889, 0.3889), (0.1, 0.0, 0.55), (0.1, -0.3889, 0.3889), (0.1, -0.55, 0.0), (0.1, -0.3889, -0.3889), (0.1, 0.0, -0.55), (0.1, 0.3889, -0.3889)]
format = primitive

; The driver sets basedir, basename and dt-out, so one solution is written
; at the end of each segment.
[soln-plugin-writer]
dt-out = 1.0
basedir = .
basename = soln-{t:.4f}
