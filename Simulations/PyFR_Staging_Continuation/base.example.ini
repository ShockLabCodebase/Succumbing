; Skeleton of the production PyFR config, showing only what the driver needs
; and the settings that matter for it. Fill in the physics (viscosity) for
; the real case. Units: D = 1, rho_inf = 1, c_inf = 1, so p_inf = 1/gamma and
; cp*T_inf = 1/(gamma - 1). The boundary names and geometry match the mesh
; from mesh/make_mesh.py: jet along +x, exit plane at x = 0, lip at r = 0.5.

[backend]
precision = double

[constants]
gamma = 1.4
; mu, Pr (and cpTref, cpTs for Sutherland) set from the experimental Re
mu = 0.0
Pr = 0.72

; Absorbing layer (see [solver-plugin-source]): sig is the relaxation rate
; at full strength, in units of c_inf/D. Ramps start at x = xsp (outlet),
; r = rsp (outer cylinder) and, behind the nozzle body (r > rob, so not in
; the plenum), at x = xup (upstream plane, x_in = -4.6875). Each ramps
; quadratically to full strength at the boundary. PyFR expressions allow
; no comparisons, so the r > rob switch is a fmin/fmax ramp.
sig = 2.0
xsp = 25.0
lsp = 15.0
rsp = 10.0
lrs = 5.0
xup = -3.1875
lup = 1.5
rob = 5.3125

[solver]
system = navier-stokes
order = 3
shock-capturing = entropy-filter
viscosity-correction = none

; PyFR requires these. Prisms (a few hundred, from leftover triangles in
; the section) and their triangular faces need their own entries.
[solver-interfaces]
riemann-solver = rusanov
ldg-beta = 0.5
ldg-tau = 0.1

[solver-interfaces-quad]
flux-pts = gauss-legendre

[solver-interfaces-tri]
flux-pts = williams-shunn

[solver-elements-hex]
soln-pts = gauss-legendre

[solver-elements-pri]
soln-pts = williams-shunn~gauss-legendre

[solver-entropy-filter]
d-min = 1e-6
p-min = 1e-6
e-tol = 1e-6
niters = 2
formulation = nonlinear

[solver-time-integrator]
formulation = std
scheme = rk45
; Fixed dt: the sampler samples every nsteps, so dt must not adapt
controller = none
dt = 0.0
; tstart and tend are overwritten by the driver for each segment
tstart = 0.0
tend = 0.0

; Screech is an acoustic feedback loop, so reflections from the boundaries
; can move the staging point. This relaxes the solution to ambient near the
; outlet, outer and upstream boundaries, where the mesh is also coarse.
; Check it by moving xsp/rsp and confirming the A1 tone does not change.
[solver-plugin-source]
rho = -sig*(pow(fmax(0.0, (x - xsp)/lsp), 2) + pow(fmax(0.0, (sqrt(y*y + z*z) - rsp)/lrs), 2) + fmin(1.0, fmax(0.0, (sqrt(y*y + z*z) - rob)/0.1))*pow(fmax(0.0, (xup - x)/lup), 2))*(rho - 1.0)
rhou = -sig*(pow(fmax(0.0, (x - xsp)/lsp), 2) + pow(fmax(0.0, (sqrt(y*y + z*z) - rsp)/lrs), 2) + fmin(1.0, fmax(0.0, (sqrt(y*y + z*z) - rob)/0.1))*pow(fmax(0.0, (xup - x)/lup), 2))*rhou
rhov = -sig*(pow(fmax(0.0, (x - xsp)/lsp), 2) + pow(fmax(0.0, (sqrt(y*y + z*z) - rsp)/lrs), 2) + fmin(1.0, fmax(0.0, (sqrt(y*y + z*z) - rob)/0.1))*pow(fmax(0.0, (xup - x)/lup), 2))*rhov
rhow = -sig*(pow(fmax(0.0, (x - xsp)/lsp), 2) + pow(fmax(0.0, (sqrt(y*y + z*z) - rsp)/lrs), 2) + fmin(1.0, fmax(0.0, (sqrt(y*y + z*z) - rob)/0.1))*pow(fmax(0.0, (xup - x)/lup), 2))*rhow
E = -sig*(pow(fmax(0.0, (x - xsp)/lsp), 2) + pow(fmax(0.0, (sqrt(y*y + z*z) - rsp)/lrs), 2) + fmin(1.0, fmax(0.0, (sqrt(y*y + z*z) - rob)/0.1))*pow(fmax(0.0, (xup - x)/lup), 2))*(E - 1.7857142857142858)

; Used only when starting from rest (restarts ignore it): ambient
[soln-ics]
rho = 1.0
u = 0.0
v = 0.0
w = 0.0
p = 0.7142857142857143

; The driver sets pt = NPR * p_ambient here. cpTt = 2.5 for a cold jet
; (T0 = T_inf). theta = 0, phi = 90 gives inflow along +x (PyFR takes
; (cos theta sin phi, sin theta sin phi, cos phi)).
[soln-bcs-inlet]
type = sub-in-ftpttang
pt = 1.5714285714285714
cpTt = 2.5
theta = 0.0
phi = 90.0

[soln-bcs-wall]
type = no-slp-adia-wall

[soln-bcs-farfield]
type = char-riem-inv
rho = 1.0
u = 0.0
v = 0.0
w = 0.0
p = 0.7142857142857143

[soln-bcs-outlet]
type = char-riem-inv
rho = 1.0
u = 0.0
v = 0.0
w = 0.0
p = 0.7142857142857143

; Lip-line ring of 8 probes (m = 0 after averaging). The driver sets file,
; file-format and file-dataset; it keeps samp-pts and nsteps from here.
; nsteps * dt sets the sampling rate: keep it well above the tone frequency
; (at least ~10 samples per A1/A2 cycle).
[soln-plugin-sampler]
nsteps = 10
samp-pts = [(0.1, 0.55, 0.0), (0.1, 0.3889, 0.3889), (0.1, 0.0, 0.55), (0.1, -0.3889, 0.3889), (0.1, -0.55, 0.0), (0.1, -0.3889, -0.3889), (0.1, 0.0, -0.55), (0.1, 0.3889, -0.3889)]
format = primitive

; The driver sets basedir, basename and dt-out, so one solution is written
; at the end of each segment.
[soln-plugin-writer]
dt-out = 1.0
basedir = .
basename = soln-{t:.4f}
