; Mean flow and second moments on five planes: xy (z = 0, x < 25, |y| < 10)
; and yz at x = 0 (exit), 1, 2.5 and 5 (r < 10). The driver writes one
; average per segment, starting after the transient. PyFR stores whole
; elements, so the region is a thin slab round each plane, holding every
; element the plane cuts; the planes are interpolated from these later.
; PyFR takes an element if its centroid or any node is in the region, so
; each slab is as thick as the distance to the nearest node of the cut
; elements. Cross-planes are split into radial bands with their own
; thickness, as the cells grow with r. The xy slab holds a layer on each
; side, since element faces lie on z = 0.
;
; The thicknesses fit the production mesh (mesh/jet.pyfrm) and come from
; tools/measure_planes.py, which also prints the region for another mesh.
; Each average is 670 MB (7% of the elements; the full near field would be
; 8 GB). On the pilot mesh the equivalent region is 91 MB.
[soln-plugin-tavg]
mode = windowed
std-mode = summary
precision = single
nsteps = 100
tstart = 0.0
dt-out = 1.0
basedir = .
basename = tavg-{t:.4f}
region = box((-4.70, -10.0, -0.001), (25.0, 10.0, 0.001)) + cylinder((-0.0020, 0, 0), (0.0020, 0, 0), 0.75) + (cylinder((-0.0140, 0, 0), (0.0140, 0, 0), 1.5) - cylinder((-0.0140, 0, 0), (0.0140, 0, 0), 0.75)) + (cylinder((-0.0180, 0, 0), (0.0180, 0, 0), 3.0) - cylinder((-0.0180, 0, 0), (0.0180, 0, 0), 1.5)) + (cylinder((-0.0260, 0, 0), (0.0260, 0, 0), 6.0) - cylinder((-0.0260, 0, 0), (0.0260, 0, 0), 3.0)) + (cylinder((-0.0940, 0, 0), (0.0940, 0, 0), 10.0) - cylinder((-0.0940, 0, 0), (0.0940, 0, 0), 6.0)) + cylinder((0.9940, 0, 0), (1.0060, 0, 0), 0.75) + (cylinder((0.9830, 0, 0), (1.0170, 0, 0), 1.5) - cylinder((0.9830, 0, 0), (1.0170, 0, 0), 0.75)) + (cylinder((0.9690, 0, 0), (1.0310, 0, 0), 3.0) - cylinder((0.9690, 0, 0), (1.0310, 0, 0), 1.5)) + (cylinder((0.9660, 0, 0), (1.0340, 0, 0), 6.0) - cylinder((0.9660, 0, 0), (1.0340, 0, 0), 3.0)) + (cylinder((0.8920, 0, 0), (1.1080, 0, 0), 10.0) - cylinder((0.8920, 0, 0), (1.1080, 0, 0), 6.0)) + cylinder((2.4950, 0, 0), (2.5050, 0, 0), 0.75) + (cylinder((2.4880, 0, 0), (2.5120, 0, 0), 1.5) - cylinder((2.4880, 0, 0), (2.5120, 0, 0), 0.75)) + (cylinder((2.4720, 0, 0), (2.5280, 0, 0), 3.0) - cylinder((2.4720, 0, 0), (2.5280, 0, 0), 1.5)) + (cylinder((2.4440, 0, 0), (2.5560, 0, 0), 6.0) - cylinder((2.4440, 0, 0), (2.5560, 0, 0), 3.0)) + (cylinder((2.4370, 0, 0), (2.5630, 0, 0), 10.0) - cylinder((2.4370, 0, 0), (2.5630, 0, 0), 6.0)) + cylinder((4.9980, 0, 0), (5.0020, 0, 0), 0.75) + (cylinder((4.9910, 0, 0), (5.0090, 0, 0), 1.5) - cylinder((4.9910, 0, 0), (5.0090, 0, 0), 0.75)) + (cylinder((4.9620, 0, 0), (5.0380, 0, 0), 3.0) - cylinder((4.9620, 0, 0), (5.0380, 0, 0), 1.5)) + (cylinder((4.9730, 0, 0), (5.0270, 0, 0), 6.0) - cylinder((4.9730, 0, 0), (5.0270, 0, 0), 3.0)) + (cylinder((4.9590, 0, 0), (5.0410, 0, 0), 10.0) - cylinder((4.9590, 0, 0), (5.0410, 0, 0), 6.0))
avg-rho = rho
avg-u = u
avg-v = v
avg-w = w
avg-p = p
avg-T = gamma*p/rho
avg-uu = u*u
avg-vv = v*v
avg-ww = w*w
avg-uv = u*v
avg-uw = u*w
avg-vw = v*w
avg-pp = p*p

; Health checks: NaN check, and the residual norms of each variable (a
; sudden rise flags a problem before it becomes a NaN)
[soln-plugin-nancheck]
nsteps = 50

[soln-plugin-residual]
nsteps = 500
file = residual.csv
header = true

; The driver sets basedir, basename and dt-out, so one solution is written
; at the end of each segment.
[soln-plugin-writer]
dt-out = 1.0
basedir = .
basename = soln-{t:.4f}
